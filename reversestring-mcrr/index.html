<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Invertir Texto</title>
</head>
<body>

    <h1>Invertir una cadena de texto</h1>

    <!-- Campo de texto donde el usuario escribe -->
    <input type="text" id="textInput" placeholder="Escribe un texto">

    <!-- Botón para invertir el texto -->
    <button onclick="reverseText()">Invertir texto</button>

    <!-- Área donde se mostrará el resultado -->
    <p>Resultado: <span id="result"></span></p>

    <!-- Conexión con el archivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
